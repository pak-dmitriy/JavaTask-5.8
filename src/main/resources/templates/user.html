<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <title>Spring Security Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3 mb-0">
    <div class="container-fluid">
        <span class ="navbar-text text-white">
            <span sec:authentication="principal.email"></span>
            with roles
            <span sec:authentication="principal.authorities"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-dark">Выйти</button>
        </form>
    </div>
</nav>
<div class="container1" style="display: flex; align-items: stretch;">
    <aside class="sidebar" style="width: 220px; flex-shrink: 0; background-color: white;">
        <nav class="sidebar__nav">
            <ul class="menu-list" style="list-style: none; margin: 0; padding: 0;">
                <li sec:authorize="hasRole('ADMIN')" style="width: 100%;"><a th:href="@{/admin}" style="display: block; width: 100%; padding: 10px 0; text-align: center; text-decoration: none; color: blue;">Admin</a></li>
                <li style="width: 100%;"><a th:href="@{/user}" style="display: block; width: 100%; padding: 10px 0; text-align: center; text-decoration: none; background-color: dodgerblue; color: white;">User</a></li>
            </ul>
        </nav>
    </aside>
    <div class="container-fluid" style="background-color: whitesmoke; min-height: 100vh; padding: 120px">
        <div class="d-flex justify-content-between">
        <h2>Добро пожаловать, <span sec:authentication="principal.name"></span>!</h2>
    </div>

    <table class="table table-striped">
        <table class="table table-hover table-bordered">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Возраст</th>
                <th>Email</th>
<!--                <th>Логин</th>-->
                <th>Роль</th>
            </tr>
            <tr>
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.email}"></td>
<!--               <td th:text="${user.username}"></td>-->
                <td>
                    <span th:each="role : ${user.roles}" th:text="${role.name + ' '}"></span>
                </td>
            </tr>
        </table>
    </table>
</div>
</div>
</body>
</html>
